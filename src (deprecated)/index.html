<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Check Dental - Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card { border-radius: 15px; }
        .d-none { display: none !important; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="mx-auto" style="max-width: 600px;">
            
            <div id="seccion-bienvenida" class="text-center card shadow p-5">
                <h2 class="mb-4 text-primary">Pre-Check Dental</h2>
                <p class="text-muted mb-4">Bienvenido, por favor selecciona una opción para continuar:</p>
                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg" onclick="mostrarSeccion('seccion-nuevo')">Soy Paciente Nuevo</button>
                    <button class="btn btn-outline-secondary btn-lg" onclick="mostrarSeccion('seccion-recurrente')">Ya soy Cliente / Re-agendar</button>
                </div>
            </div>

            <div id="seccion-nuevo" class="d-none">
                <button class="btn btn-sm btn-link mb-3" onclick="mostrarSeccion('seccion-bienvenida')">← Volver</button>
                <div class="card shadow p-4">
                    <h3 class="mb-4">Nuevo Historial Clínico</h3>
                    <form id="formNuevo">
                        <h6 class="text-primary border-bottom pb-2">Datos Personales</h6>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono (WhatsApp)</label>
                                <input type="tel" class="form-control" id="telefono" required placeholder="10 dígitos">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>
                        </div>

                        <h6 class="text-danger border-bottom pb-2 mt-3">Alertas Médicas</h6>
                        <div class="mb-3">
                            <label class="form-label">¿Es alérgico a algo? (Penicilina, Anestesia, etc.)</label>
                            <textarea class="form-control border-danger" id="alergias" rows="2" placeholder="Escriba 'Ninguna' si no tiene"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">¿Padece alguna enfermedad o toma medicamentos?</label>
                            <input type="text" class="form-control" id="enfermedades">
                        </div>

                        <h6 class="text-primary border-bottom pb-2 mt-3">Motivo de Consulta</h6>
                        <div class="mb-3">
                            <label class="form-label">¿Por qué nos visita hoy?</label>
                            <textarea class="form-control" id="motivo" rows="2" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-3">Enviar mi Registro</button>
                    </form>
                </div>
            </div>

            <div id="seccion-recurrente" class="d-none">
                <button class="btn btn-sm btn-link mb-3" onclick="mostrarSeccion('seccion-bienvenida')">← Volver</button>
                <div class="card shadow p-4 text-center">
                    <h3 class="mb-4">Identificarse</h3>
                    <p class="text-muted">Ingresa tus datos para agendar tu cita rápidamente.</p>
                    <form id="formRecurrente">
                        <div class="mb-3 text-start">
                            <label class="form-label">Teléfono Registrado</label>
                            <input type="tel" class="form-control" id="telBusqueda" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaBusqueda" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Verificar y Continuar</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfjWWw2dW4mEhgLG_7wSKmQQCh4gck6lU",
            authDomain: "precheck-dental.firebaseapp.com",
            projectId: "precheck-dental",
            storageBucket: "precheck-dental.firebasestorage.app",
            messagingSenderId: "893834959540",
            appId: "1:893834959540:web:84cd5fcbd1489d398e95e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Compartimos las funciones con el archivo app.js
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
    </script>
    
    <script src="app.js"></script>
</body>
</html>
